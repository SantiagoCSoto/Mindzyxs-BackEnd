name: CI - Build API

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore Mindzyxs-API.csproj
      - run: dotnet build Mindzyxs-API.csproj --configuration Release --no-restore
      - run: dotnet publish Mindzyxs-API.csproj --configuration Release --no-build --output ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish
          retention-days: 7
