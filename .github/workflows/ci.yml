name: CI - Build and PR to main

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Mindzyxs-API.csproj

      - name: Build
        run: dotnet build Mindzyxs-API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Mindzyxs-API.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish
          retention-days: 7

      - name: Resolve conflicts with main (merge main into develop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop ya incluye main; sin conflictos."
          else
            if git merge origin/main --no-edit; then
              git push origin develop
              echo "Merge de main en develop realizado y pusheado."
            else
              echo "CONFLICTO entre develop y main. Resolver manualmente."
              git merge --abort
              exit 1
            fi
          fi

      - name: Create PR develop -> main (if not exists)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base main --head develop --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head develop \
              --title "Merge develop into main" \
              --body "PR automatico generado por CI tras build exitoso."
          else
            echo "Ya existe un PR abierto de develop a main."
          fi
