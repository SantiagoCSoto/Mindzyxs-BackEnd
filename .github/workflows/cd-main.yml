name: CD - Deploy API to Production (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore and publish
        run: |
          dotnet restore Mindzyxs-API.csproj
          dotnet publish Mindzyxs-API.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./publish

# Required secrets (production):
#   AZURE_WEBAPP_NAME_PROD            -> nombre del App Service de producción
#   AZURE_WEBAPP_PUBLISH_PROFILE_PROD -> publish profile de producción
# Se ejecuta cuando el PR de develop a main es mergeado.
