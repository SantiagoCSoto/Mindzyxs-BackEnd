name: CD - Deploy API to Azure App Service

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: |
          dotnet restore Mindzyxs-API.csproj
          dotnet publish Mindzyxs-API.csproj --configuration Release --output ./publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

# Secrets: AZURE_WEBAPP_NAME, AZURE_WEBAPP_PUBLISH_PROFILE
# App Settings: ConnectionStrings__Mindzyxs, Smtp__*, Firebase__*, ASPNETCORE_ENVIRONMENT=Production
